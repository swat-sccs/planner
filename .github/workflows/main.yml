# Force push code to GitLab for deployment

name: Mirror

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure GitLab SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIRRORBOT_GIT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MIRRORBOT_GIT_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "MIRRORBOT_GIT_SSH_PRIVATE_KEY is empty or missing"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "MIRRORBOT_GIT_SSH_KNOWN_HOSTS is empty or missing"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Mirror branches and tags to GitLab
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts
        run: |
          git remote add target git@gitlab.sccs.swarthmore.edu:sccs/planner.git
          git fetch origin '+refs/heads/*:refs/mirror/heads/*' --tags --prune
          git push --force --prune target '+refs/mirror/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
