stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  REGISTRY: registry.sccs.swarthmore.edu/$CI_PROJECT_PATH
  PLANNER_IMAGE: $REGISTRY/planner
  CRON_IMAGE: registry.sccs.swarthmore.edu/sccs/planner-cron/planner-cron

default:
  image: docker:29.1.5
  services:
    - name: docker:29.1.5-dind

  before_script:
    - apk add --no-cache bash curl
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - mv .secure_files/.env .env
    - mv .secure_files/scraper.env scraper.env
    - docker info
    - printf '%s' "$SCCS_REGISTRY_TOKEN" | docker login --username "$SCCS_REGISTRY_USER" --password-stdin "$SCCS_REGISTRY"

# Build immutable images for this commit. The rolling latest tags are only used
# as cache sources; deployment always uses CI_COMMIT_SHORT_SHA.
build:
  stage: build
  script:
    - |
      docker pull "$PLANNER_IMAGE:latest" || echo "No planner cache image found; continuing without it."
      docker pull "$CRON_IMAGE:latest" || echo "No cron cache image found; continuing without it."

      docker build \
        --cache-from "$PLANNER_IMAGE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --file Dockerfile \
        --tag "$PLANNER_IMAGE:$CI_COMMIT_SHORT_SHA" \
        .
      docker build \
        --cache-from "$CRON_IMAGE:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --file Dockerfile.cron \
        --tag "$CRON_IMAGE:$CI_COMMIT_SHORT_SHA" \
        .

      docker push "$PLANNER_IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$CRON_IMAGE:$CI_COMMIT_SHORT_SHA"

      docker tag "$PLANNER_IMAGE:$CI_COMMIT_SHORT_SHA" "$PLANNER_IMAGE:latest"
      docker tag "$CRON_IMAGE:$CI_COMMIT_SHORT_SHA" "$CRON_IMAGE:latest"
      docker push "$PLANNER_IMAGE:latest"
      docker push "$CRON_IMAGE:latest"
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

deploy:
  stage: deploy
  services: []
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  script:
    - IMAGE_TAG="$CI_COMMIT_SHORT_SHA" docker stack deploy --with-registry-auth --compose-file docker-compose.yml planner
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  needs:
    - build
